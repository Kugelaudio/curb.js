name: Bug report
description: Something in Curb does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx curb dev
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a repository, or a snippet small enough to paste here.
    validations:
      required: true
  - type: textarea
    id: curb-info
    attributes:
      label: Output of `npx curb info`
      description: Run it in your project. It prints variable names only, never their values.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: preview
    attributes:
      label: Latest version
      description: Install it with `npm install curb@npm:curb.js@preview`.
      options:
        - label: I tried the latest `preview` version
          required: true
