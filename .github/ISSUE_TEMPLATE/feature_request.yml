name: Feature request
description: Propose something Curb should do that it does not do today.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features start as an issue, so we can agree on the approach before anyone writes code. To talk an idea through first, start a [discussion](https://github.com/Kugelaudio/curb.js/discussions).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do with Curb, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: How it would work for someone using Curb. A snippet of the component, hook, prop or command you have in mind helps.
      render: tsx
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including what you do today instead.
    validations:
      required: false
