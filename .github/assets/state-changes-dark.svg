<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="When the order is empty the agent can only add a drink. Once it has a drink, the place_order tool appears." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>When the order is empty the agent can only add a drink. Once it has a drink, the place_order tool appears.</title>
<rect x="20" y="20" width="320" height="140" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="44" y="56" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Order is empty</text>
<text x="44" y="86" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">The agent can use</text>
<rect x="44" y="104" width="87.8" height="32" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="87.9" y="125" font-size="14" font-weight="500" fill="#e6edf3" text-anchor="middle">add_drink</text>
<rect x="540" y="20" width="320" height="140" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="564" y="56" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Order: 1 latte</text>
<text x="564" y="86" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">The agent can use</text>
<rect x="564" y="104" width="87.8" height="32" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="607.9" y="125" font-size="14" font-weight="500" fill="#e6edf3" text-anchor="middle">add_drink</text>
<rect x="661.8" y="104" width="104.19999999999999" height="32" rx="6" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="713.9" y="125" font-size="14" font-weight="500" fill="#3fb950" text-anchor="middle">place_order</text>
<line x1="352" y1="90" x2="522" y2="90" stroke="#9198a1" stroke-width="1.5"/>
<path d="M514 85L521 90L514 95" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="437" y="78" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">Caller orders a latte</text>
</svg>
