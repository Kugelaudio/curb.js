<svg xmlns="http://www.w3.org/2000/svg" width="880" height="288" viewBox="0 0 880 288" role="img" aria-label="How curb.js works: the caller talks to curb.js, which handles the voice and renders your React app as the agent's context. Speech-to-text, LLM and text-to-speech are swappable." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
