# Prefixes keep titles valid for the pull request title rule: type(scope): subject.
# Dependabot capitalises the subject, which scripts/pr-rules.mjs allows for its login alone.
# compat/ holds projects frozen from older releases: it is neither a workspace nor listed here,
# and exclude-paths keeps it that way.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - compat/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci(deps)
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
