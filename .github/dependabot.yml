# Prefixes keep titles valid for the pull request title rule: type(scope): subject.
# Dependabot capitalises the subject, which scripts/pr-rules.mjs allows for its login alone.
# compat/ holds projects frozen from older releases: it is neither a workspace nor listed here,
# and exclude-paths keeps it that way.
#
# cooldown waits until a release is a week old before proposing it: a hijacked package is
# usually caught and pulled within days. Security updates ignore it and still open at once.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - compat/**
    # The published packages pin exact versions (scripts/dependency-pins.test.mjs): move a pin,
    # never widen it into a range.
    versioning-strategy: increase
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    # astro check embeds the TypeScript language service, and TypeScript 7 ships no API for it.
    # Drop this once @astrojs/check allows typescript 7 in its peer range.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
