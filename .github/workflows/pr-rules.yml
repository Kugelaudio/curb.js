name: pr-rules

# Checks a pull request's title and body (scripts/pr-rules.mjs). edited is here because the
# default triggers do not rerun when a title changes. No paths filter or job condition: this
# always reports, so it can be a required check.
#
# pull_request_target because on pull_request GitHub takes this file from the pull request,
# which could replace the check with run: true. Here it comes from the base branch. That is
# safe only while this job never checks out the pull request's code and passes neither its
# title nor its body through a shell or a ${{ }} expression.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-rules:
    name: pr-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The workflow and the script both come from the base branch: nothing from the pull
      # request is checked out or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - run: node scripts/pr-rules.mjs
