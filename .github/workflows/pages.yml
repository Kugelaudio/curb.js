name: pages

# Builds website/ and publishes it to curbjs.com through GitHub Pages. Runs on
# github.com/Kugelaudio/curb.js. website/ lives only there, and the guide it renders
# comes from the framework's docs/agent-guide. The custom domain is a repository
# setting: with this kind of deployment GitHub ignores a CNAME file. Only main deploys it. On a
# pull request the website suite in test.yml builds and tests the site, inside the required gate,
# so here a pull request runs only for a change to this file, the one thing that suite cannot try.
# A fork's pull request builds on a GitHub-hosted runner, for the reason test.yml gives.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/framework/docs/agent-guide/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# A group keeps one pending run and cancels the rest, so one group across pull requests would
# cancel another pull request's check. Each gets its own, where a new push replaces the old run.
# Deploys share one and always finish: a deploy waiting behind it is only replaced by a newer one,
# which carries the same changes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'curb-js-runner' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'curb-js-runner' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
