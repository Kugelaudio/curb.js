name: publish

# Every release is built from source here, in this one file: npm trusts it through trusted
# publishers, so no npm token exists anywhere. A publisher names this repository, `publish.yml`
# and the `npm` environment. npm accepts GitHub-hosted runners only, and gives provenance from a
# public repository only.
#
#   preview   a merge to main that changes a published package, or a dispatch on main with
#             channel preview. Publishes <next minor>-preview.<n> to the `preview` dist-tag, with
#             a matching git tag.
#   stable    a dispatch on main with channel stable and a semver. Adds a `v<version>` tag,
#             publishes the bumped version to `latest`, then adds a GitHub Release. Being able to
#             dispatch is the gate.
#
# dry_run does everything except publish, tag and release, on either channel.
#
# Tags hold the version (scripts/release-version.mjs). It is stamped into the tarballs at build
# time, because no workflow can push a commit to main. The tarballs verify tests are the ones
# publish sends. A tag pushed with GITHUB_TOKEN starts no workflow, so nothing here listens for
# tags.
#
# The order is verify, tag, publish, release, because npm cannot take a version back and a tag can
# become impossible to write. GITHUB_TOKEN has no workflows permission and no job can grant it, so
# GitHub can refuse it a new ref on a commit whose workflow files differ from main's, which a merge
# that changes a workflow during a run can cause. The REST call answers 403 "Resource not accessible
# by integration", git push and a Release that would create the tag are refused the same way, and
# no rerun helps while main stays ahead. Tagging first means a refusal ends the run with nothing on
# npm. A Release on a tag that already exists creates no ref and was not refused where tagging was.
#
#   tag fails       nothing was published. A rerun cannot help after a 403: start a new run from
#                   main, which plans the same version on the newer commit.
#   publish fails   "Re-run failed jobs" finishes it within the artifact's 7 days: the tag and every
#                   package npm holds are skipped. A publish that can never succeed leaves a tag
#                   naming a version npm lacks. It stays, because tags are immutable, so that number
#                   is skipped and the next release notes start after it.
#   release fails   "Re-run failed jobs" finishes it.
#
# create-kugelaudio is built and verified in every run, but the repository variable
# CREATE_KUGELAUDIO decides whether it is published: unset, it is not; `preview`, it goes to the
# `preview` dist-tag on either channel, so its `latest` stays where it is; `release`, it follows
# the run. It publishes last, so a publisher npm refuses cannot hold back the other three. plan
# reads the variable, so a change reaches a new run and not a rerun.
#
# After a publish, installed creates a project from the public registry. It runs beside release
# and does not hold it back: npm cannot take a version back, and a version it holds must have its
# release. So a failure there leaves the run red with the tag in place, and the fix is a new
# release.

on:
  push:
    branches: [main]
    paths:
      - packages/framework/**
      - packages/create-curb.js/**
      - '!packages/framework/docs/**'
      - '!packages/*/*.md'
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to release to
        type: choice
        options: [preview, stable]
        default: preview
      semver:
        description: Which part of the version to bump, for a stable release
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: Do everything except publish, tag and release
        type: boolean
        default: false

permissions:
  contents: read

# One group per channel. A merge and a dispatched preview share one, so they cannot race for the
# same preview number. Stable has its own: GitHub keeps one pending run per group, so a preview
# sharing it could cancel the waiting stable release. Nothing in progress is cancelled. A preview
# that was only queued can be replaced by a newer one, which carries the same changes. A push has
# no inputs, so it reads as preview.
concurrency:
  group: release-${{ inputs.channel || 'preview' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      git_tag: ${{ steps.version.outputs.git_tag }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      kugelaudio_tag: ${{ steps.version.outputs.kugelaudio_tag }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "A release runs on main, and this run is on $GITHUB_REF." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: version
        env:
          CHANNEL: ${{ inputs.channel || 'preview' }}
          SEMVER: ${{ inputs.semver }}
          CREATE_KUGELAUDIO: ${{ vars.CREATE_KUGELAUDIO }}
        run: node scripts/release-version.mjs --channel "$CHANNEL" --semver "$SEMVER"

  verify:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # CPU binaries ship in npm; the Linux postinstall otherwise downloads CUDA from NuGet.
      ONNXRUNTIME_NODE_INSTALL: skip
      VERSION: ${{ needs.plan.outputs.version }}
      GIT_TAG: ${{ needs.plan.outputs.git_tag }}
      DIST_TAG: ${{ needs.plan.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run check:examples
      - run: npm run check:compat
      - run: npm run check:independence
      - run: npm run smoke:self-host
      - name: Write the release notes
        run: |
          mkdir out
          npx --yes git-cliff@2.14.2 --config cliff.toml --unreleased --tag "$GIT_TAG" --output out/release-notes.md
          cat out/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Pack the tarballs from source
        run: node scripts/npm-package.mjs "$VERSION" out --notes out/release-notes.md
      - name: Scaffold a project from the tarballs
        run: node scripts/release-install-test.mjs out
      - name: Dry-run the publication
        run: |
          # The ./ matters: npm reads out/x.tgz as the GitHub repository out/x.tgz.
          for name in curb.js create-curb.js create-curb create-kugelaudio; do
            npm publish --dry-run --access public --tag "$DIST_TAG" "./out/$name-$VERSION.tgz"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out
          if-no-files-found: error
          retention-days: 7

  tag:
    needs: [plan, verify]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the commit to release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ needs.plan.outputs.git_tag }}
        run: |
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GIT_TAG" --jq .object.sha 2>/dev/null); then
            [[ "$existing" == "$GITHUB_SHA" ]] || { echo "$GIT_TAG is already on $existing" >&2; exit 1; }
          elif ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$GIT_TAG" -f "sha=$GITHUB_SHA"; then
            echo "::error::Could not tag $GITHUB_SHA as $GIT_TAG, so nothing was published. After a 403, main's workflow files have moved past this commit and a rerun cannot help: start a new run from main."
            exit 1
          fi

  publish:
    needs: [plan, verify, tag]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    environment:
      name: npm
      deployment: false
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DIST_TAG: ${{ needs.plan.outputs.dist_tag }}
      KUGELAUDIO_TAG: ${{ needs.plan.outputs.kugelaudio_tag }}
      NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.17.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      # Before the first publish: a package npm lacks cannot have a trusted publisher, so its
      # publish would fail after curb.js went out, leaving half a release.
      - name: Refuse half a release
        run: |
          for name in curb.js create-curb.js create-curb create-kugelaudio; do
            npm view "$name" name >/dev/null || { echo "$name is not on npm; publish nothing until it is" >&2; exit 1; }
          done
      - name: Publish what npm lacks
        run: |
          # curb.js first: the others pin it.
          for name in curb.js create-curb.js create-curb create-kugelaudio; do
            tag="$DIST_TAG"
            [[ "$name" != create-kugelaudio ]] || tag="$KUGELAUDIO_TAG"
            if [[ -z "$tag" ]]; then
              echo "$name is not published: CREATE_KUGELAUDIO is not set"
            elif npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
            else
              npm publish --access public --tag "$tag" "./out/$name-$VERSION.tgz"
            fi
          done
      - name: Read the publication back
        run: |
          for name in curb.js create-curb.js create-curb create-kugelaudio; do
            [[ "$name" != create-kugelaudio || -n "$KUGELAUDIO_TAG" ]] || continue
            spec="$name@$VERSION"
            tarball="out/$name-$VERSION.tgz"
            expected="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            for attempt in $(seq 1 60); do
              found=$(npm view "$spec" dist.integrity 2>/dev/null) || found=""
              [[ "$found" == "$expected" ]] && break
              sleep 10
            done
            [[ "$found" == "$expected" ]] || { echo "npm serves ${found:-nothing} for $spec, expected $expected" >&2; exit 1; }
            echo "$spec is on npm"
          done

  installed:
    name: installed (Node ${{ matrix.node }})
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
          KUGELAUDIO_TAG: ${{ needs.plan.outputs.kugelaudio_tag }}
        run: node scripts/published-install-test.mjs "$VERSION"

  release:
    needs: [plan, publish]
    if: needs.plan.outputs.dist_tag == 'latest'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIT_TAG: ${{ needs.plan.outputs.git_tag }}
        run: |
          if gh release view "$GIT_TAG" >/dev/null 2>&1; then
            echo "$GIT_TAG already has a release"
          else
            gh release create "$GIT_TAG" --verify-tag --title "$GIT_TAG" --notes-file out/release-notes.md
          fi
