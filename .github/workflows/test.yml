name: test

# Linux only for now. A pull request runs only the suites its changes can affect
# (scripts/affected.mjs); main runs them all. check:independence always runs, on everything.
# gate is the required check: it always reports, so a pull request that skips test can merge.
# The test job runs on curb-js-runner, this repository's self-hosted runner. It takes one job at a
# time, so the legs of a matrix run one after another. affected suites and gate take seconds and
# run on curb-js-light, a runner of their own, so they never wait behind a test job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Every other run gets a group of
# its own, because a group keeps one pending run and replaces the rest, cancel-in-progress or
# not, which would drop a queued push to main. gate stays on always(): in a cancelled run it
# fails on the superseded commit, and the newest commit's run reports. With !cancelled() it
# would be skipped, and a skipped required check passes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-pr-{0}', github.event.pull_request.number) || format('test-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    name: affected suites
    runs-on: curb-js-light
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.affected.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: affected
        run: node scripts/affected.mjs
      - run: npm run check:independence

  test:
    name: test (Node ${{ matrix.node }})
    needs: affected
    if: needs.affected.outputs.suites != '' && needs.affected.outputs.suites != 'website'
    runs-on: curb-js-runner
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs the engines floor, which '22' would skip by resolving to the newest
        # 22.x. main runs both majors the README promises.
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22.12"]') || fromJSON('["22.12", "24"]') }}
    env:
      # CPU binaries ship in npm; the Linux postinstall otherwise downloads CUDA from NuGet.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
        if: contains(needs.affected.outputs.suites, 'framework')
      - run: npm test --workspace packages/framework
        if: contains(needs.affected.outputs.suites, 'framework')
      - run: npm test --workspace packages/create-curb.js
        if: contains(needs.affected.outputs.suites, 'scaffolders')
      - run: node --test "scripts/*.test.mjs"
        if: contains(needs.affected.outputs.suites, 'scripts')
      - run: npm run check:examples
        if: contains(needs.affected.outputs.suites, 'examples')
      - run: npm run check:compat
        if: contains(needs.affected.outputs.suites, 'compat')
      - run: npm run smoke:self-host
        if: contains(needs.affected.outputs.suites, 'smoke')
      # The tarball half of publish.yml's verify job, on one Node. This workflow has no token, no
      # id-token and no npm environment, so it cannot publish: the version only ever lands in a
      # dry run. It is a preview so that the channel's own paths run.
      - name: Pack, install and dry-run the tarballs
        if: contains(needs.affected.outputs.suites, 'package') && strategy.job-index == 0
        env:
          VERSION: 0.0.0-preview.0
        run: |
          mkdir out
          node scripts/npm-package.mjs "$VERSION" out
          node scripts/release-install-test.mjs out
          # The ./ matters: npm reads out/x.tgz as the GitHub repository out/x.tgz.
          for name in curb.js create-curb.js; do
            npm publish --dry-run --access public --tag preview "./out/$name-$VERSION.tgz"
          done

  # The site has its own lockfile and a higher Node floor, so it is not a row of test.
  website:
    needs: affected
    if: contains(needs.affected.outputs.suites, 'website')
    runs-on: curb-js-runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website

  gate:
    needs: [affected, test, website]
    if: always()
    runs-on: curb-js-light
    timeout-minutes: 5
    steps:
      - env:
          AFFECTED: ${{ needs.affected.result }}
          TEST: ${{ needs.test.result }}
          WEBSITE: ${{ needs.website.result }}
        run: |
          echo "affected: $AFFECTED, test: $TEST, website: $WEBSITE"
          [ "$AFFECTED" = success ]
          for result in "$TEST" "$WEBSITE"; do
            [ "$result" = success ] || [ "$result" = skipped ]
          done
