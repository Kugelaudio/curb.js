name: test

# Standard GitHub runners are free on a public repository and billed on a private one.
# Runs on the systems Curb's users develop on.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
  pull_request:
    paths-ignore:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: '22' }
          - { os: ubuntu-24.04, node: '24' }
    env:
      # CPU binaries ship in npm; the Linux postinstall otherwise downloads CUDA from NuGet.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run check:independence
      - run: npm run check:examples
      - run: npm run check:compat
      - run: npm run smoke:self-host
