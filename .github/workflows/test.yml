name: test

# Linux only for now. A pull request runs only the suites its changes can affect
# (scripts/affected.mjs); main runs them all. check:independence always runs, on everything.
# gate is the required check: it always reports, so a pull request that skips test can merge.
# The test and package jobs run on curb-js-runner, this repository's self-hosted runner. affected
# suites and gate take seconds and run on curb-js-light, a runner of their own, so they never wait
# behind a test job.
#
# A test leg's steps should finish in well under 20 minutes. Its 40-minute timeout is a margin for
# a busy machine, not room to grow into. What runs on one Node only (the static
# browser build and the tarballs) is the package job, which runs beside the legs instead of
# after one of them.
#
# Self-hosted runners persist between jobs, so a fork's pull request runs the same jobs on a
# GitHub-hosted runner instead. It must run them, not skip them: gate passes a skipped job. Each
# runs-on names who may use a self-hosted runner, so anything else lands on the hosted one, and
# scripts/workflow-safety.test.mjs holds every job to that. pull_request reads this file from the
# pull request, so a fork could edit runs-on: approving its run is what stops that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Every other run gets a group of
# its own, because a group keeps one pending run and replaces the rest, cancel-in-progress or
# not, which would drop a queued push to main. gate stays on always(): in a cancelled run it
# fails on the superseded commit, and the newest commit's run reports. With !cancelled() it
# would be skipped, and a skipped required check passes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-pr-{0}', github.event.pull_request.number) || format('test-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    name: affected suites
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'curb-js-light' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.affected.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: affected
        run: node scripts/affected.mjs
      - run: npm run check:independence

  test:
    name: test (Node ${{ matrix.node }})
    needs: affected
    if: needs.affected.outputs.suites != '' && needs.affected.outputs.suites != 'website'
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'curb-js-runner' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs the engines floor, which '22' would skip by resolving to the newest
        # 22.x. main runs both majors the README promises.
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22.12"]') || fromJSON('["22.12", "24"]') }}
    env:
      # CPU binaries ship in npm; the Linux postinstall otherwise downloads CUDA from NuGet.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A self-hosted runner keeps ~/.npm on its own disk, so only a hosted one restores it from
      # GitHub's cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      # A damaged cache fails npm ci instead of being refetched, so it goes and the install runs again.
      - run: npm ci --prefer-offline --no-audit --no-fund || { npm cache clean --force && npm ci --prefer-offline --no-audit --no-fund; }
      # tsc skips output it believes is written, so the tsbuildinfo and the output are kept together.
      - name: npm run build
        if: contains(needs.affected.outputs.suites, 'framework')
        env:
          TSC_CACHE: ${{ hashFiles('package-lock.json') }}-${{ matrix.node }}
        run: npm run build --workspace packages/framework -- --incremental --tsBuildInfoFile "$HOME/.cache/curb-tsc/$TSC_CACHE/info" --outDir "$HOME/.cache/curb-tsc/$TSC_CACHE/dist"
      - run: npm test --workspace packages/framework
        if: contains(needs.affected.outputs.suites, 'framework')
      - run: npm test --workspace packages/create-curb.js
        if: contains(needs.affected.outputs.suites, 'scaffolders')
      # A test that hangs fails with its name after two minutes instead of using up the job.
      - run: node --test --test-timeout=120000 "scripts/*.test.mjs"
        if: contains(needs.affected.outputs.suites, 'scripts')
      - run: npm run check:examples
        if: contains(needs.affected.outputs.suites, 'examples')
      - run: npm run check:compat
        if: contains(needs.affected.outputs.suites, 'compat')
      - run: npm run smoke:self-host
        if: contains(needs.affected.outputs.suites, 'smoke')

  # What one Node is enough for, beside the test legs rather than after one of them.
  package:
    name: package (Node 22.12)
    needs: affected
    if: contains(needs.affected.outputs.suites, 'browser') || contains(needs.affected.outputs.suites, 'package')
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'curb-js-runner' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: npm ci --prefer-offline --no-audit --no-fund || { npm cache clean --force && npm ci --prefer-offline --no-audit --no-fund; }
      - run: npm run check:browser
        if: contains(needs.affected.outputs.suites, 'browser')
      # The tarball half of publish.yml's verify job. This workflow has no token, no id-token and
      # no npm environment, so it cannot publish: the version only ever lands in a dry run. It is
      # a preview so that the channel's own paths run.
      - name: Pack, install and dry-run the tarballs
        if: contains(needs.affected.outputs.suites, 'package')
        env:
          VERSION: 0.0.0-preview.0
        run: |
          mkdir out
          node scripts/npm-package.mjs "$VERSION" out
          node scripts/release-install-test.mjs out
          # The ./ matters: npm reads out/x.tgz as the GitHub repository out/x.tgz.
          for name in curb.js create-curb.js create-curb create-kugelaudio; do
            npm publish --dry-run --access public --tag preview "./out/$name-$VERSION.tgz"
          done

  # The site has its own lockfile and a higher Node floor, so it is not a row of test.
  website:
    needs: affected
    if: contains(needs.affected.outputs.suites, 'website')
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'curb-js-runner' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund || { npm cache clean --force && npm ci --no-audit --no-fund; }
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website

  gate:
    needs: [affected, test, package, website]
    if: always()
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'curb-js-light' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - env:
          AFFECTED: ${{ needs.affected.result }}
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package.result }}
          WEBSITE: ${{ needs.website.result }}
        run: |
          echo "affected: $AFFECTED, test: $TEST, package: $PACKAGE, website: $WEBSITE"
          [ "$AFFECTED" = success ]
          for result in "$TEST" "$PACKAGE" "$WEBSITE"; do
            [ "$result" = success ] || [ "$result" = skipped ]
          done
